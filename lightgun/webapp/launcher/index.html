<!DOCTYPE html>
<!--
    OpenFIRE Web App - home of the published site.

    Not the app: one button. It asks the lightgun which firmware it runs, looks that
    version up in versions.json and opens the app published for it (v/<version>/).
    The app itself never lives here - every version of it lives in its own folder.

    The scripts between the markers are joined into launcher.js by
    scripts/webapp_build.py (python scripts/webapp_build.py launcher). The connection and
    the reading of the first packet are the same files the app uses, so there is one
    implementation of the protocol and not two.

    Served from webapp/launcher/ it also runs unbundled, for development.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFIRE Web App</title>
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 90.691 90.691'%3E%3Crect width='90.691' height='90.691' ry='9.6' fill='%232a2a2a'/%3E%3Cg transform='translate(2,2)'%3E%3Cpath fill='%23fff' d='M86.6 40H81.3C79.6 22.2 65.4 7.9 47.6 6.3V0h-7V6.1C22.8 7.9 8.5 22.1 6.9 40h-7v7h7c1.7 17.8 15.9 32.1 33.7 33.7v5.6h7V80.7C65.4 79 79.7 64.8 81.3 47h5.3zm-72.9 3.5c0-16.8 13.6-30.4 30.4-30.4 16.8 0 28.4 11.8 30.2 26.9H40.6V73.7C25.5 72 13.7 59.1 13.7 43.5ZM47.6 73.6V60.9H59.8V55.2H47.6V46.9H74.3C72.7 60.9 61.6 72 47.6 73.6Z'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root {
    color-scheme: light;
    --bg: #eef0f4; --surface: #ffffff; --surface-2: #f6f7f9; --surface-3: #e9ecf1;
    --border: #d3d8e0; --border-strong: #b9c0cc;
    --text: #1c2230; --muted: #556070; --faint: #8b94a3;
    --accent: #0a7fc2; --accent-soft: rgba(10, 127, 194, 0.12); --link: #0a6fb0;
    --focus: 0 0 0 3px rgba(10, 127, 194, 0.35);
    --shadow: 0 1px 2px rgba(20, 28, 45, 0.06), 0 2px 6px rgba(20, 28, 45, 0.06);
    --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161b; --surface: #1d2027; --surface-2: #252932; --surface-3: #2d323c;
        --border: #363b47; --border-strong: #4a5160;
        --text: #e6e8ed; --muted: #a6aebb; --faint: #767f8f;
        --accent: #2fa6e4; --accent-soft: rgba(47, 166, 228, 0.16); --link: #8ab4f8;
        --focus: 0 0 0 3px rgba(47, 166, 228, 0.4);
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
        --danger: #f2b8b5;
    }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #14161b; --surface: #1d2027; --surface-2: #252932; --surface-3: #2d323c;
    --border: #363b47; --border-strong: #4a5160;
    --text: #e6e8ed; --muted: #a6aebb; --faint: #767f8f;
    --accent: #2fa6e4; --accent-soft: rgba(47, 166, 228, 0.16); --link: #8ab4f8;
    --focus: 0 0 0 3px rgba(47, 166, 228, 0.4);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 2px 8px rgba(0, 0, 0, 0.25);
    --danger: #f2b8b5;
}

* { box-sizing: border-box; }
body {
    margin: 0; min-height: 100vh; padding: 0 0 48px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; align-items: center;
}
/* ----- Barra superiore: tema e lingua, come nelle altre pagine del progetto ----- */
.topbar {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 6px 16px; margin-bottom: 40px;
    background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
.topbar .brand svg { width: 24px; height: 24px; display: block; border-radius: 5px; }
.topbar .brand-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; }
.topbar .spacer { flex: 1; }
.controls { display: flex; align-items: center; gap: 8px; }
.control {
    height: 32px; display: inline-flex; align-items: center; gap: 6px; padding: 0 8px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; white-space: nowrap; font: inherit; color: inherit;
}
.control:hover { background: var(--surface-3); border-color: var(--border-strong); }
select.control { padding-right: 4px; min-height: 30px; font-size: 13px; }
.control .icon { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor;
                 stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.theme-button .caret { width: 10px; height: 10px; stroke-width: 2.4; }
.theme-wrap { position: relative; display: flex; }
.theme-menu {
    position: absolute; right: 0; top: calc(100% + 4px); min-width: 172px; padding: 4px;
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 8px;
    box-shadow: 0 10px 30px rgba(20, 28, 45, 0.22);
    display: none; flex-direction: column; gap: 2px; z-index: 5; text-align: left;
}
.theme-menu[data-open="true"] { display: flex; }
.theme-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
    background: none; border: 0; border-radius: 6px; text-align: left; cursor: pointer;
    font: inherit; color: inherit; font-size: 14px;
}
.theme-menu button:hover { background: var(--accent-soft); }
.theme-menu button[aria-checked="true"] { color: var(--accent); font-weight: 600; }
.theme-menu .tick { margin-left: auto; width: 16px; height: 16px; opacity: 0; }
.theme-menu button[aria-checked="true"] .tick { opacity: 1; }

main { width: 100%; max-width: 560px; text-align: center; padding: 0 16px; }
.mark { width: 56px; height: 56px; margin: 0 auto 14px; border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.mark svg { width: 100%; height: 100%; display: block; }
h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 4.5vw, 2rem); letter-spacing: -0.02em; }
h1 .accent { color: var(--accent); }
.lead { margin: 0 auto 28px; max-width: 46ch; color: var(--muted); line-height: 1.55; }
a { color: var(--link); }
:focus-visible { outline: none; box-shadow: var(--focus); border-radius: 8px; }

.connect {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 0 26px; height: 52px;
    font-size: 1.05rem; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 10px; cursor: pointer;
    box-shadow: var(--shadow);
}
.connect:hover { filter: brightness(1.06); }
.connect[disabled] { opacity: 0.6; cursor: default; filter: none; }
.connect svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.state { margin: 18px auto 0; min-height: 1.5em; color: var(--muted); line-height: 1.5; max-width: 46ch; }
.state.bad { color: var(--danger); }

.versions { margin: 28px auto 0; text-align: left; display: none; }
.versions.on { display: block; }
.versions h2 { margin: 0 0 4px; font-size: 1rem; }
.versions p { margin: 0 0 14px; color: var(--muted); font-size: 0.9rem; line-height: 1.5; }
.item {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 15px; margin-bottom: 9px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow); text-decoration: none; color: inherit;
}
.item:hover { border-color: var(--accent); }
.item .num { font-weight: 600; }
.item .tag { margin-left: auto; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 0.78rem; font-weight: 600; }
.more { margin-top: 20px; font-size: 0.9rem; }
.more button { background: none; border: 0; color: var(--link); cursor: pointer; font: inherit; text-decoration: underline; padding: 0; }
footer { margin-top: 34px; color: var(--faint); font-size: 0.85rem; text-align: center; padding: 0 16px; }
@media (max-width: 420px) { .topbar .brand-name { display: none; } }
</style>
</head>
<body>

<header class="topbar">
    <span class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90.691 90.691" aria-hidden="true"><rect width="90.691" height="90.691" ry="9.6" fill="#2a2a2a"/><g transform="translate(2,2)"><path fill="#fff" d="M86.6 40H81.3C79.6 22.2 65.4 7.9 47.6 6.3V0h-7V6.1C22.8 7.9 8.5 22.1 6.9 40h-7v7h7c1.7 17.8 15.9 32.1 33.7 33.7v5.6h7V80.7C65.4 79 79.7 64.8 81.3 47h5.3zm-72.9 3.5c0-16.8 13.6-30.4 30.4-30.4 16.8 0 28.4 11.8 30.2 26.9H40.6V73.7C25.5 72 13.7 59.1 13.7 43.5ZM47.6 73.6V60.9H59.8V55.2H47.6V46.9H74.3C72.7 60.9 61.6 72 47.6 73.6Z"/><g fill="#ed1a3b"><circle cx="24.9" cy="49" r="3.1"/><circle cx="34" cy="49" r="3.1"/><circle cx="24.9" cy="57.8" r="3.1"/><circle cx="34" cy="57.8" r="3.1"/></g><path fill="#00b3f0" d="M44.3 20.2C33 20.2 23.6 28.7 22.2 39.7h4.7c1.3-8.4 8.6-14.9 17.4-14.9 8.8 0 9.1 1.8 12.5 5.2l3.3-3.3C55.9 22.5 50.3 20.2 44.4 20.2Z"/></g></svg><span class="brand-name">OpenFIRE ESP32</span></span>
    <span class="spacer"></span>
    <span class="controls"></span>
</header>

<main>
    <div class="mark">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90.691 90.691" aria-hidden="true"><rect width="90.691" height="90.691" ry="9.6" fill="#2a2a2a"/><g transform="translate(2,2)"><path fill="#fff" d="M86.6 40H81.3C79.6 22.2 65.4 7.9 47.6 6.3V0h-7V6.1C22.8 7.9 8.5 22.1 6.9 40h-7v7h7c1.7 17.8 15.9 32.1 33.7 33.7v5.6h7V80.7C65.4 79 79.7 64.8 81.3 47h5.3zm-72.9 3.5c0-16.8 13.6-30.4 30.4-30.4 16.8 0 28.4 11.8 30.2 26.9H40.6V73.7C25.5 72 13.7 59.1 13.7 43.5ZM47.6 73.6V60.9H59.8V55.2H47.6V46.9H74.3C72.7 60.9 61.6 72 47.6 73.6Z"/><g fill="#ed1a3b"><circle cx="24.9" cy="49" r="3.1"/><circle cx="34" cy="49" r="3.1"/><circle cx="24.9" cy="57.8" r="3.1"/><circle cx="34" cy="57.8" r="3.1"/></g><path fill="#00b3f0" d="M44.3 20.2C33 20.2 23.6 28.7 22.2 39.7h4.7c1.3-8.4 8.6-14.9 17.4-14.9 8.8 0 9.1 1.8 12.5 5.2l3.3-3.3C55.9 22.5 50.3 20.2 44.4 20.2Z"/></g></svg>
    </div>
    <h1>OpenFIRE <span class="accent">Web App</span></h1>
    <p class="lead" id="lead"></p>

    <button class="connect" id="connect" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 3.5v6M16.5 3.5v6M5 9.5h14v3a7 7 0 0 1-5 6.7v4.3h-4V19.2a7 7 0 0 1-5-6.7z"/></svg>
        <span id="connect-label"></span>
    </button>

    <div class="state" id="state" role="status" aria-live="polite"></div>

    <section class="versions" id="versions">
        <h2 id="versions-title"></h2>
        <p id="versions-lead"></p>
        <div id="versions-list"></div>
    </section>

    <div class="more"><button type="button" id="show-versions"></button></div>
</main>

<footer id="footer"></footer>

<!-- OF:SCRIPTS  (joined in this order into launcher.js by scripts/webapp_build.py) -->
<script src="../boards/OpenFIREshared.js"></script>
<script src="../js/core/transport.js"></script>
<script src="../js/core/protocol.js"></script>
<script src="launcher.js"></script>
<!-- /OF:SCRIPTS -->
</body>
</html>
