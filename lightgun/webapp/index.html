<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenFIRE Configurator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>OpenFIRE Web Configurator</h1>
        <p id="status">Connecting...</p>
    </header>

    <main>
        <section class="board-container">
            <h2>Your Board</h2>
            <!-- L'immagine SVG che il firmware ci servirà dinamicamente! -->
            <img src="board.svg" alt="Microcontroller Board" id="board-image" />
        </section>

        <section class="controls">
            <button id="btn-test">Send Test Command</button>
        </section>
    </main>

    <script src="boards/OpenFIREshared.js"></script>
    <script src="app.js"></script>
</body>
</html>
