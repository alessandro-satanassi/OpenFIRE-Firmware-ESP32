; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = WAVESHARE_ESP32_C5_ZERO_N4       ;ESP32C5 Mini  - FLASH 4Mb  (QUAD spi - qio) NO PSRAM - 384KB SRAM, 320KB ROM - RISC-V 32-bit single core  at 240 MHz

; Le impostazioni globali delle cartelle vanno qui!
boards_dir = ../shared_boards

[env]

[esp32]
platform_packages = 

[common]
platform = https://github.com/pioarduino/platform-espressif32.git#61.04.00   ; Arduino v4.0.0 based on ESP-IDF v6.1.1

lib_deps = 
    LovyanGFX Library = https://github.com/lovyan03/LovyanGFX.git#1.3.0

build_unflags = 
	; == FLAG RELATIVI AL COMPILATORE
    -Os
    -Og

build_flags = 
    -D SCOPE
    -D USE_LOVYAN_GFX
    ; == FLAG RELATIVI AL COMPILATORE
    -Wno-stringop-overflow
    -O2

[display_WAVESHARE_ESP32_C5_ZERO]


;                                     ______(*USB*)______     
;                                (5V) |-)  1  PIN  18 (-| (TX) (GPIO 11) (UART0 TX)
;           GND display <--     (GND) |x)  2       17 (-| (RX) (GPIO 12) (UART0 RX)
;           VCC display <-- (3V3 OUT) |p)  3       16 (-| (GPIO 13) (USB D-)
;           BLK display <-- (GPIO 00) |x)  4       15 (-| (GPIO 14) (USB D+)
;           SCL display <-- (GPIO 01) |x)  5       14 (x| (GPIO 10) --> UART TX scope (verso RX lightgun S3)
;           SDA display <-- (GPIO 02) |x)  6       13 (x| (GPIO 09) <-- UART RX scope (da TX lightgun S3)
;           RES display <-- (GPIO 03) |x)  7       12 (-| (GPIO 08)                  
;            DC display <-- (GPIO 04) |x)  8       11 (-| (GPIO 07)                 
;            CS display <-- (GPIO 05) |x)  9  PIN  10 (-| (GPIO 06)                
;                                     |                 |
;                                     |  ANT       ANT  |
;                                     |_________________|


build_unflags = 

build_flags = 
    -D SPI_HOST=SPI2_HOST       ;solo lgfx
    -D SPI_MODE=0               ;solo lgfx
    -D SPI_FREQUENCY=80000000
    -D TFT_MISO=-1
    -D TFT_MOSI=2            ; SDA  on board display
    -D TFT_SCLK=1            ; SCL  on board display
    -D TFT_CS=5              ; CS   on board display
    -D TFT_DC=4              ; DC   on board display
    -D TFT_RST=3             ; RES  on board display
    -D TFT_PIN_BL=0          ; BLK  on board display (retroilluminazione)
    -D TFT_PIN_BL_PWM_CHANNEL=-1 ;solo lgfx
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_OFFSET_X=0            ;solo lgfx
    -D TFT_OFFSET_Y=0           ;solo lgfx
    -D TFT_INVERT=1             ;solo lgfx
    -D TFT_RGB_ORDER=0

[env:WAVESHARE_ESP32_C5_ZERO_N4]
platform = ${common.platform}
board = WAVESHARE-ESP32-C5-ZERO-N4
framework = arduino
monitor_speed = 115200
lib_deps = 
	${common.lib_deps}
build_unflags = 
	${common.build_unflags}
	${display_WAVESHARE_ESP32_C5_ZERO.build_unflags}
build_flags = 
	-D ARDUINO_WAVESHARE_ESP32_C5_ZERO_N4
	-D OPENFIRE_WIRELESS_ENABLE
	;-D OPENFIRE_WIFI_POWER=68 ; forza il valore della potenza di trasmissione al valore impostato; se non viene messo questo flag viene impostato il valore 68 di default
	;-D OPENFIRE_WIFI_CHANNEL=12 ; forza il canale al valore impostato
    -D OPENFIRE_AUTO_CHANNEL_WIFI ; imposta la ricerca automatica del canale ideale per la trasmissione espnow
	;-D DEBUG_WIFI_SCOPE ; radio diagnostics on the dongle's display (lost packets...) / diagnostica radio sul display del dongle (pacchetti persi...)
	-D ARDUINO_USB_MODE=1         ; 1 = Serial su USB Serial/JTAG hardware (HWCDC): il C5 non ha USB OTG
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D USES_DISPLAY
	;-D DUAL_CORE
    -D ANTENNA_SWITCH_GPIO=26
    -D WS2812_RGB_LED_GPIO=27
    -D SCOPE_UART_TX_GPIO=10   ; UART1 scope -> RX lightgun ESP32-S3
    -D SCOPE_UART_RX_GPIO=9    ; UART1 scope <- TX lightgun ESP32-S3
	${common.build_flags}
	${display_WAVESHARE_ESP32_C5_ZERO.build_flags}
platform_packages = ${esp32.platform_packages}
board_build.partitions = ../shared_boards/partitions/default_OF_4MB.csv
lib_extra_dirs = ../shared_lib
lib_ldf_mode = chain
lib_compat_mode = strict