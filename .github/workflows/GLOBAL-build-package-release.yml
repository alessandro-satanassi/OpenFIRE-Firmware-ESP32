name: GLOBAL - OpenFIRE Build Package and Upload ALL

on:
  workflow_dispatch:
    inputs:
      sistemi_operativi:
        description: "Vuoi Creare anche i file per i sistemi operativi ? (necessario per creare release)"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      release:
        description: "Vuoi creare una release globale ?"
        required: true
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"
      tag_name:
        description: "Tag della release (es. v1.2.0 - es. v6.0-RC6) (usato solo se release=yes)"
        required: false
        default: ""
      release_name:
        description: "Nome leggibile della release (es. v6.0-RC6 OpenFIRE Firmware ESP32 - GLOBAL Release)"
        required: false
        default: ""
      draft:
        description: "Vuoi impostare la release come DRAFT? (false = NO, pubblica subito  - true = SI, lascialo in draft mode)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"  
      prerelease:
        description: "E' una pre-release ? (false = NO  - true = SI, imposta il flag pre-release)"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"  

      update_webflasher:
        description: "Vuoi aggiornare anche il repository del Web Flasher?"
        required: true
        type: boolean
        default: false
      update_webapp:
        description: "Vuoi aggiornare anche il repository della WebApp?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # ==========================================
  # 1. BUILD FIRMWARE (PARALLELO)
  # ==========================================
  build_lightgun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Build LIGHTGUN - ${{ matrix.boards }}
    strategy:
      matrix:
        include:
          - boards: 'ESP32_S3_WROOM1_DevKitC_1_N16R8'
            name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - boards: 'ESP32_S3_WROOM1_DevKitC_1_N8R2'
            name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - boards: 'WAVESHARE_ESP32_S3_PICO'
            name: 'WAVESHARE_ESP32_S3_PICO'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - boards: 'WAVESHARE_ESP32_S3_ZERO_N8R8'
            name: 'WAVESHARE_ESP32_S3_ZERO_N8R8'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - boards: 'WAVESHARE_ESP32_S3_ZERO_N4R2'
            name: 'WAVESHARE_ESP32_S3_ZERO_N4R2'
            chip: 'esp32s3'
            flash_size: '4MB'
            flash_mode: 'dio'
            flash_freq: '80m'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio rich_click intelhex
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - if: (matrix.chip == 'esp32s3')
        run: |
          cd lightgun
          pio run -e ${{ matrix.boards }}
          # One merged image without a filesystem; scripts select whether to erase all flash.
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip ${{ matrix.chip }} merge_bin -o OpenFIRE-LIGHTGUN-${{ matrix.boards }}.bin --flash_mode ${{ matrix.flash_mode }} --flash_size ${{ matrix.flash_size }} \
            0x0000 .pio/build/${{ matrix.boards }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.boards }}/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/${{ matrix.boards }}/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-LIGHTGUN-${{ matrix.boards }}
          path: lightgun/OpenFIRE-LIGHTGUN-${{ matrix.boards }}.bin
          if-no-files-found: error

      # The site contains all boards: publish it from one matrix entry only.
      # Unlike the optional PlatformIO export, errors here must fail the release.
      - name: Prepare WebApp publication
        if: ${{ matrix.boards == 'ESP32_S3_WROOM1_DevKitC_1_N16R8' && github.event.inputs.update_webapp == 'true' && github.event.inputs.release == 'yes' && github.event.inputs.tag_name != '' && github.event.inputs.sistemi_operativi == 'yes' }}
        run: |
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('lightgun/scripts').resolve()))
          import webapp_build

          project = str(Path('lightgun').resolve())
          dist = Path('lightgun/dist')
          result = webapp_build.build_site(project, str(dist / 'site'))
          webapp_build.build_launcher(project, str(dist / 'launcher'))
          (dist / 'version.json').write_text(
              json.dumps(result['version'], indent=2) + '\n', encoding='utf-8')
          print('WebApp ready for v/' + result['version']['id'] + '/')
          PY

      - name: Upload WebApp publication
        if: ${{ matrix.boards == 'ESP32_S3_WROOM1_DevKitC_1_N16R8' && github.event.inputs.update_webapp == 'true' && github.event.inputs.release == 'yes' && github.event.inputs.tag_name != '' && github.event.inputs.sistemi_operativi == 'yes' }}
        uses: actions/upload-artifact@v7
        with:
          # Separate from OpenFIRE-* artifacts: these files are not release assets.
          name: webapp-publication
          path: |
            lightgun/dist/site/
            lightgun/dist/launcher/
            lightgun/dist/version.json
          include-hidden-files: true # Preserve launcher/.nojekyll.
          if-no-files-found: error

  build_dongle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Build DONGLE
    strategy:
      matrix:
        include:
          - name: 'LILYGO_T_DONGLE_S3' 
            boards: 'LILYGO_T_DONGLE_S3'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'GNPE_POCKET_DONGLE_S3_N16R8' 
            boards: 'GNPE_POCKET_DONGLE_S3_N16R8'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8' 
            boards: 'ESP32_S3_WROOM1_DevKitC_1_N16R8'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2' 
            boards: 'ESP32_S3_WROOM1_DevKitC_1_N8R2'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'WAVESHARE_ESP32_S3_PICO' 
            boards: 'WAVESHARE_ESP32_S3_PICO'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'    
          - name: 'WAVESHARE_ESP32_S3_ZERO_N8R8' 
            boards: 'WAVESHARE_ESP32_S3_ZERO_N8R8'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'       
          - name: 'WAVESHARE_ESP32_S3_ZERO_N4R2' 
            boards: 'WAVESHARE_ESP32_S3_ZERO_N4R2'
            chip: 'esp32s3'
            flash_size: '4MB'
            flash_mode: 'dio'
            flash_freq: '80m'                      
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio rich_click intelhex
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - if: (matrix.chip == 'esp32s3')
        run: |
          cd dongle
          pio run -e ${{ matrix.boards }}
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip ${{ matrix.chip }} merge_bin -o OpenFIRE-DONGLE-${{ matrix.boards }}.bin --flash_mode ${{ matrix.flash_mode }} --flash_size ${{ matrix.flash_size }} \
            0x0000 .pio/build/${{ matrix.boards }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.boards }}/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/${{ matrix.boards }}/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-DONGLE-${{ matrix.boards }}
          path: dongle/OpenFIRE-DONGLE-${{ matrix.boards }}.bin
          if-no-files-found: error

  build_pedal:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: Build PEDAL
    strategy:
      matrix:
        include:
          - name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8' 
            boards: 'ESP32_S3_WROOM1_DevKitC_1_N16R8'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2' 
            boards: 'ESP32_S3_WROOM1_DevKitC_1_N8R2'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'
          - name: 'WAVESHARE_ESP32_S3_PICO' 
            boards: 'WAVESHARE_ESP32_S3_PICO'
            chip: 'esp32s3'
            flash_size: '16MB'
            flash_mode: 'dio'
            flash_freq: '80m'       
          - name: 'WAVESHARE_ESP32_S3_ZERO_N8R8' 
            boards: 'WAVESHARE_ESP32_S3_ZERO_N8R8'
            chip: 'esp32s3'
            flash_size: '8MB'
            flash_mode: 'dio'
            flash_freq: '80m'       
          - name: 'WAVESHARE_ESP32_S3_ZERO_N4R2' 
            boards: 'WAVESHARE_ESP32_S3_ZERO_N4R2'
            chip: 'esp32s3'
            flash_size: '4MB'
            flash_mode: 'dio'
            flash_freq: '80m'       
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio rich_click intelhex
      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
      - if: (matrix.chip == 'esp32s3')
        run: |
          cd pedal
          pio run -e ${{ matrix.boards }}
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip ${{ matrix.chip }} merge_bin -o OpenFIRE-PEDAL-${{ matrix.boards }}.bin --flash_mode ${{ matrix.flash_mode }} --flash_size ${{ matrix.flash_size }} \
            0x0000 .pio/build/${{ matrix.boards }}/bootloader.bin \
            0x8000 .pio/build/${{ matrix.boards }}/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 .pio/build/${{ matrix.boards }}/firmware.bin
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-PEDAL-${{ matrix.boards }}
          path: pedal/OpenFIRE-PEDAL-${{ matrix.boards }}.bin
          if-no-files-found: error

  # ==========================================
  # 2. PACKAGE ASSETS (PARALLELO)
  # ==========================================
  package_lightgun:
    needs: build_lightgun
    if: ${{ github.event.inputs.sistemi_operativi == 'yes' }}
    runs-on: ${{ matrix.os_config.runner }}
    strategy:
      matrix:
        boards:
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_PICO', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N8R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N4R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
        os_config:
          - { name: windows-64bit, runner: windows-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-windows-amd64.zip', esptool_tipo_file: zip, esptool_path_in_zip: 'esptool-windows-amd64/', esptool_filename_in_zip: 'esptool.exe', script_name: 'flash_firmware.bat' }
          - { name: linux-amd-64bit, runner: ubuntu-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-linux-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-linux-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
          - { name: macos-64bit, runner: macos-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-macos-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-macos-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenFIRE-LIGHTGUN-${{ matrix.boards.name }}
          path: ./downloaded_firmware
      - shell: bash
        run: |
          mkdir staging_dir
          mv "./downloaded_firmware/OpenFIRE-LIGHTGUN-${{ matrix.boards.name }}.bin" "./staging_dir/firmware.bin"
      - shell: bash 
        run: |
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "zip" ]]; then curl -L -o esptool_archive.zip "${{ matrix.os_config.esptool_url }}"; unzip -j esptool_archive.zip "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}" -d staging_dir; fi
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "tar.gz" ]]; then curl -L -o esptool_archive.tar.gz "${{ matrix.os_config.esptool_url }}"; tar -xzf esptool_archive.tar.gz -C staging_dir --strip-components=1 "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}"; fi
          if [[ "${{ matrix.os_config.name }}" == "linux-amd-64bit" || "${{ matrix.os_config.name }}" == "macos-64bit" ]]; then chmod +x "staging_dir/${{ matrix.os_config.esptool_filename_in_zip }}"; fi
      - shell: bash 
        run: |
          SCRIPT_PATH="staging_dir/${{ matrix.os_config.script_name }}"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
          cat <<'EOF' > "$SCRIPT_PATH"
          @echo off
          setlocal
          echo Flashing OpenFIRE LIGHTGUN Firmware for board: ${{ matrix.boards.name }}
          set "ERASE_OPTION="
          set "FLASH_CHOICE="
          echo WARNING: a clean install deletes ALL flash data, including settings and calibrations.
          set /p FLASH_CHOICE="Type '1' for a clean install, or press Enter to keep settings: "
          if "%FLASH_CHOICE%"=="1" set "ERASE_OPTION=--erase-all"
          ${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash %ERASE_OPTION% -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          pause
          EOF
          else
          cat <<'EOF' > "$SCRIPT_PATH"
          #!/bin/bash
          echo "Flashing OpenFIRE LIGHTGUN Firmware for board: ${{ matrix.boards.name }}"
          ERASE_OPTIONS=()
          FLASH_CHOICE=""
          echo "WARNING: a clean install deletes ALL flash data, including settings and calibrations."
          IFS= read -r -p "Type '1' for a clean install, or press Enter to keep settings: " FLASH_CHOICE
          if [[ "$FLASH_CHOICE" == "1" ]]; then ERASE_OPTIONS=(--erase-all); fi
          ./${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash "${ERASE_OPTIONS[@]}" -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          EOF
          chmod +x "$SCRIPT_PATH"
          fi
      - shell: bash
        run: |
          ARCHIVE_FILENAME="OpenFIRE-LIGHTGUN-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
            powershell -Command "Compress-Archive -Path staging_dir\* -DestinationPath ${{ github.workspace }}/$ARCHIVE_FILENAME -Force"
          else
            (cd staging_dir && zip -r "${{ github.workspace }}/$ARCHIVE_FILENAME" .)
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-LIGHTGUN-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip
          path: ${{ github.workspace }}/OpenFIRE-LIGHTGUN-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip

  package_dongle:
    needs: build_dongle
    if: ${{ github.event.inputs.sistemi_operativi == 'yes' }}
    runs-on: ${{ matrix.os_config.runner }}
    strategy:
      matrix:
        boards:
          - { name: 'LILYGO_T_DONGLE_S3', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'GNPE_POCKET_DONGLE_S3_N16R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }          
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_PICO', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N8R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N4R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
        os_config:
          - { name: windows-64bit, runner: windows-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-windows-amd64.zip', esptool_tipo_file: zip, esptool_path_in_zip: 'esptool-windows-amd64/', esptool_filename_in_zip: 'esptool.exe', script_name: 'flash_firmware.bat' }
          - { name: linux-amd-64bit, runner: ubuntu-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-linux-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-linux-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
          - { name: macos-64bit, runner: macos-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-macos-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-macos-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenFIRE-DONGLE-${{ matrix.boards.name }}
          path: ./downloaded_firmware
      - shell: bash
        run: |
          mkdir staging_dir
          mv ./downloaded_firmware/OpenFIRE-DONGLE-${{ matrix.boards.name }}.bin ./staging_dir/firmware.bin
      - shell: bash 
        run: |
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "zip" ]]; then curl -L -o esptool_archive.zip "${{ matrix.os_config.esptool_url }}"; unzip -j esptool_archive.zip "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}" -d staging_dir; fi
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "tar.gz" ]]; then curl -L -o esptool_archive.tar.gz "${{ matrix.os_config.esptool_url }}"; tar -xzf esptool_archive.tar.gz -C staging_dir --strip-components=1 "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}"; fi
          if [[ "${{ matrix.os_config.name }}" == "linux-amd-64bit" || "${{ matrix.os_config.name }}" == "macos-64bit" ]]; then chmod +x "staging_dir/${{ matrix.os_config.esptool_filename_in_zip }}"; fi
      - shell: bash 
        run: |
          SCRIPT_PATH="staging_dir/${{ matrix.os_config.script_name }}"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
          cat <<EOF > "$SCRIPT_PATH"
          @echo off
          echo Flashing OpenFIRE DONGLE Firmware for board: ${{ matrix.boards.name }}
          ${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          pause
          EOF
          else
          cat <<EOF > "$SCRIPT_PATH"
          #!/bin/bash
          ./${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          EOF
          chmod +x "$SCRIPT_PATH"
          fi
      - shell: bash
        run: |
          ARCHIVE_FILENAME="OpenFIRE-DONGLE-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
            powershell -Command "Compress-Archive -Path staging_dir\* -DestinationPath ${{ github.workspace }}/$ARCHIVE_FILENAME -Force"
          else
            (cd staging_dir && zip -r "${{ github.workspace }}/$ARCHIVE_FILENAME" .)
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-DONGLE-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip
          path: ${{ github.workspace }}/OpenFIRE-DONGLE-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip

  package_pedal:
    needs: build_pedal
    if: ${{ github.event.inputs.sistemi_operativi == 'yes' }}
    runs-on: ${{ matrix.os_config.runner }}
    strategy:
      matrix:
        boards:
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N16R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'ESP32_S3_WROOM1_DevKitC_1_N8R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_PICO', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N8R8', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
          - { name: 'WAVESHARE_ESP32_S3_ZERO_N4R2', chip: 'esp32s3', flash_mode: 'dio', flash_freq: '80m' }
        os_config:
          - { name: windows-64bit, runner: windows-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-windows-amd64.zip', esptool_tipo_file: zip, esptool_path_in_zip: 'esptool-windows-amd64/', esptool_filename_in_zip: 'esptool.exe', script_name: 'flash_firmware.bat' }
          - { name: linux-amd-64bit, runner: ubuntu-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-linux-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-linux-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
          - { name: macos-64bit, runner: macos-latest, esptool_url: 'https://github.com/espressif/esptool/releases/download/v5.1.0/esptool-v5.1.0-macos-amd64.tar.gz', esptool_tipo_file: tar.gz, esptool_path_in_zip: 'esptool-macos-amd64/', esptool_filename_in_zip: 'esptool', script_name: 'flash_firmware.sh' }
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: OpenFIRE-PEDAL-${{ matrix.boards.name }}
          path: ./downloaded_firmware
      - shell: bash
        run: |
          mkdir staging_dir
          mv ./downloaded_firmware/OpenFIRE-PEDAL-${{ matrix.boards.name }}.bin ./staging_dir/firmware.bin
      - shell: bash 
        run: |
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "zip" ]]; then curl -L -o esptool_archive.zip "${{ matrix.os_config.esptool_url }}"; unzip -j esptool_archive.zip "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}" -d staging_dir; fi
          if [[ "${{ matrix.os_config.esptool_tipo_file }}" == "tar.gz" ]]; then curl -L -o esptool_archive.tar.gz "${{ matrix.os_config.esptool_url }}"; tar -xzf esptool_archive.tar.gz -C staging_dir --strip-components=1 "${{ matrix.os_config.esptool_path_in_zip }}${{ matrix.os_config.esptool_filename_in_zip }}"; fi
          if [[ "${{ matrix.os_config.name }}" == "linux-amd-64bit" || "${{ matrix.os_config.name }}" == "macos-64bit" ]]; then chmod +x "staging_dir/${{ matrix.os_config.esptool_filename_in_zip }}"; fi
      - shell: bash 
        run: |
          SCRIPT_PATH="staging_dir/${{ matrix.os_config.script_name }}"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
          cat <<EOF > "$SCRIPT_PATH"
          @echo off
          echo Flashing OpenFIRE PEDAL Firmware for board: ${{ matrix.boards.name }}
          ${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          pause
          EOF
          else
          cat <<EOF > "$SCRIPT_PATH"
          #!/bin/bash
          ./${{ matrix.os_config.esptool_filename_in_zip }} --chip ${{ matrix.boards.chip }} --baud 460800 write-flash -z --flash-mode ${{ matrix.boards.flash_mode }} --flash-freq ${{ matrix.boards.flash_freq }} 0x0000 firmware.bin
          EOF
          chmod +x "$SCRIPT_PATH"
          fi
      - shell: bash
        run: |
          ARCHIVE_FILENAME="OpenFIRE-PEDAL-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip"
          if [[ "${{ matrix.os_config.name }}" == "windows-64bit" ]]; then
            powershell -Command "Compress-Archive -Path staging_dir\* -DestinationPath ${{ github.workspace }}/$ARCHIVE_FILENAME -Force"
          else
            (cd staging_dir && zip -r "${{ github.workspace }}/$ARCHIVE_FILENAME" .)
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: OpenFIRE-PEDAL-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip
          path: ${{ github.workspace }}/OpenFIRE-PEDAL-${{ matrix.boards.name }}-${{ matrix.os_config.name }}.zip

# ==========================================
  # 3. SYNC FIRMWARE TO WEB FLASHER REPOSITORY
  # ==========================================
  sync_web_firmware:
    #needs: [build_lightgun, build_dongle, build_pedal]
    needs: [package_lightgun, package_dongle, package_pedal]
    runs-on: ubuntu-latest
    
    concurrency:
      group: sync-flasher-${{ github.ref }}
      cancel-in-progress: false
      
    if: ${{ github.event.inputs.update_webflasher == 'true' && github.event.inputs.release == 'yes' && github.event.inputs.tag_name != '' }}
    
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name }}
      # URL FISSO DEL TUO SECONDO REPOSITORY
      TARGET_REPO: "alessandro-satanassi/OpenFIRE-ESP32-WebFlasher"
      
    steps:
      - name: Verify Execution Branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ERRORE FATALE: Stai eseguendo la Action da un Tag Storico."
            exit 1
          fi

      # 1. SCARICA IL REPOSITORY WEB (Usando il Token Segreto)
      - name: Checkout Web Flasher Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.WEBFLASHER_TOKEN }}
          path: web_repo # Salva il repo web in una cartella temporanea

      # 2. SCARICA I BINARI APPENA COMPILATI DAL REPO 1
      - name: Download ALL compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: OpenFIRE-*
          path: ./all_binaries

# 3. COPIA I FILE E GENERA IL MANIFEST.JSON
      - name: Copy .bin files and Generate manifest.json
        run: |
          export TARGET_DIR="web_repo/firmware/${TAG_NAME}"
          export TAG_NAME
          
          mkdir -p -- "$TARGET_DIR"
          find ./all_binaries -name "*.bin" -type f -exec cp -- "{}" "$TARGET_DIR/" \;
          
          # Script Python integrato per generare il manifest.json analizzando i nomi dei file
          python3 -c "
          import os, json
          
          target_dir = os.environ.get('TARGET_DIR')
          tag_name = os.environ.get('TAG_NAME')
          
          files = sorted([f for f in os.listdir(target_dir) if f.endswith('.bin')])
          
          manifest = {
              'version': tag_name,
              'files': files,
              'supported_boards': {
                  'LIGHTGUN': [],
                  'DONGLE': [],
                  'PEDAL': []
              }
          }
          
          for f in files:
              name = f.replace('.bin', '')
              parts = name.split('-')
              
              if len(parts) >= 3:
                  device = parts[1] # Estrae LIGHTGUN, DONGLE o PEDAL
                  board = '-'.join(parts[2:])
                  
                  # Aggiunge la board alla lista se non è già presente
                  if device in manifest['supported_boards'] and board and board not in manifest['supported_boards'][device]:
                      manifest['supported_boards'][device].append(board)
                      
          with open(os.path.join(target_dir, 'manifest.json'), 'w') as out:
              json.dump(manifest, out, indent=2)
          "
          
          echo "File binari e manifest.json pronti per il trasferimento:"
          ls -lh -- "$TARGET_DIR"
          cat "$TARGET_DIR/manifest.json"

      # 4. TRASFERIMENTO SUL SERVER (SISTEMA BLINDATO)
      - name: Commit and Push to Web Flasher Repo
        run: |
          # Entriamo fisicamente nella cartella del Repo 2
          cd web_repo
          
          export GIT_TERMINAL_PROMPT=0
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git config core.autocrlf false
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 20
          git config http.postBuffer 524288000
          
          git add -f -- "firmware/${TAG_NAME}"
          
          if ! git diff --staged --quiet; then
            echo "Modifiche rilevate nel Repo Web. Preparazione del commit..."
            
            printf "Auto-sync firmware binaries for Web Flasher (%s)\n" "$TAG_NAME" | git commit -F -
            
            echo "Avvio Sincronizzazione Cross-Repo (Sistema Anti-Glitch con Recovery)..."
            
            SYNC_SUCCESS="false"
            for i in 1 2 3; do
              echo "--- Tentativo $i di 3 ---"
              
              if ! git pull origin main --rebase -X theirs; then
                echo "Rete instabile o conflitto durante il pull."
                git rebase --abort >/dev/null 2>&1 || true
                [ $i -lt 3 ] && sleep 5
                continue
              fi
              
              if git push origin main; then
                echo "Sincronizzazione completata! I file sono online su OpenFIRE-ESP32-WebFlasher."
                SYNC_SUCCESS="true"
                break
              fi
              
              echo "Rete instabile durante il push."
              [ $i -lt 3 ] && sleep 5
            done
            
            if [ "$SYNC_SUCCESS" = "false" ]; then
              echo "ERRORE FATALE: Impossibile trasferire i file nel Web Flasher dopo 3 tentativi."
              exit 1
            fi
            
          else
            echo "Nessuna modifica rilevata nei file binari. Push ignorato per mantenere pulita la history."
          fi
          
  # ==========================================
  # 4. SYNC WEBAPP TO GITHUB PAGES REPOSITORY
  # ==========================================
  sync_webapp:
    needs: [package_lightgun, package_dongle, package_pedal]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Every source branch writes the same destination branch and versions.json.
      group: sync-openfire-webapp-main
      cancel-in-progress: false
    if: ${{ github.event.inputs.update_webapp == 'true' && github.event.inputs.release == 'yes' && github.event.inputs.tag_name != '' && github.event.inputs.sistemi_operativi == 'yes' }}
    env:
      TAG_NAME: ${{ github.event.inputs.tag_name }}
    steps:
      - name: Verify Execution Branch
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ERRORE FATALE: Stai eseguendo la Action da un Tag Storico."
            exit 1
          fi

      - name: Checkout WebApp Repository
        uses: actions/checkout@v6
        with:
          repository: alessandro-satanassi/OpenFIRE-ESP32-WebApp
          ref: main
          token: ${{ secrets.WEBAPP_TOKEN }}
          path: webapp_repo

      - name: Download generated WebApp
        uses: actions/download-artifact@v8
        with:
          name: webapp-publication
          path: webapp_dist

      - name: Update versioned site, launcher and versions.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path('webapp_dist')
          repo = Path('webapp_repo')
          version = json.loads((source / 'version.json').read_text(encoding='utf-8-sig'))
          if not isinstance(version, dict) or any(
              not isinstance(version.get(key), str) for key in ('id', 'label', 'type')
          ) or not re.fullmatch(r'[0-9]+\.[0-9]', version['id']):
              raise RuntimeError('Invalid WebApp version metadata')

          # The folder ID is OPENFIRE_VERSION, not the release tag or full semver.
          version_id = version['id']
          required = ('site/index.html', 'site/style.css', 'site/app.js',
                      'launcher/index.html', 'launcher/launcher.js', 'launcher/.nojekyll')
          for name in required:
              path = source / name
              if not path.is_file() or (path.name != '.nojekyll' and path.stat().st_size == 0):
                  raise RuntimeError('Missing or empty WebApp file: ' + name)
          if not any((source / 'site/boards/pics').glob('*.js')):
              raise RuntimeError('WebApp board pictures are missing')

          index_path = repo / 'versions.json'
          index = json.loads(index_path.read_text(encoding='utf-8-sig')) if index_path.exists() else {'versions': []}
          if not isinstance(index, dict) or not isinstance(index.get('versions'), list):
              raise RuntimeError('Invalid versions.json: publication aborted')
          entries = index['versions']
          ids = set()
          for entry in entries:
              if not isinstance(entry, dict) or not isinstance(entry.get('id'), str) or not entry['id'] or entry['id'] in ids:
                  raise RuntimeError('Invalid or duplicate entry in versions.json')
              ids.add(entry['id'])

          # Keep all other versions and any extra metadata already in the index.
          current = next((entry for entry in entries if entry['id'] == version_id), {})
          current.update(version)
          index['versions'] = [current] + [entry for entry in entries if entry['id'] != version_id]
          index['latest'] = version_id

          target = repo / 'v' / version_id
          # Only replace this generated version, never the repository or all of v/.
          if (repo / 'v').is_symlink() or target.is_symlink():
              raise RuntimeError('Refusing to replace a symlinked version directory')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source / 'site', target)
          for name in ('index.html', 'launcher.js', '.nojekyll'):
              shutil.copyfile(source / 'launcher' / name, repo / name)
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('WEBAPP_VERSION=' + version_id + '\n')
          print('WebApp updated in v/' + version_id + '/; other versions preserved.')
          PY

      - name: Commit and Push to WebApp Repo
        working-directory: webapp_repo
        run: |
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 20

          git add -f -- "v/${WEBAPP_VERSION}" index.html launcher.js .nojekyll versions.json
          if git diff --staged --quiet; then
            echo "WebApp gia' aggiornata: nessun commit necessario."
            exit 0
          fi
          printf 'Auto-sync WebApp %s (%s)\n' "$WEBAPP_VERSION" "$TAG_NAME" | git commit -F -

          # Retry transport errors, but never force or auto-resolve concurrent edits.
          # A conflicting remote update must fail the sync and block this release.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Repository WebApp sincronizzato; GitHub Pages pubblichera' il sito."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "ERRORE FATALE: Sincronizzazione WebApp non riuscita. Release bloccata."
          exit 1

  # ==========================================
  # 5. CREAZIONE DELLA RELEASE GLOBALE (DOPO le sincronizzazioni richieste)
  # ==========================================
  create_global_release:
    # A disabled sync may be skipped; every requested sync must explicitly succeed.
    needs: [package_lightgun, package_dongle, package_pedal, sync_web_firmware, sync_webapp]
    runs-on: ubuntu-latest
    if: >-
      ${{ !failure() && !cancelled() &&
          github.event.inputs.release == 'yes' &&
          github.event.inputs.sistemi_operativi == 'yes' &&
          github.event.inputs.tag_name != '' &&
          needs.package_lightgun.result == 'success' &&
          needs.package_dongle.result == 'success' &&
          needs.package_pedal.result == 'success' &&
          (github.event.inputs.update_webflasher != 'true' || needs.sync_web_firmware.result == 'success') &&
          (github.event.inputs.update_webapp != 'true' || needs.sync_webapp.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Fondamentale per leggere GLOBAL_template.md

      - name: Prepare GLOBAL Release Body
        id: prepare_body
        run: |
          TEMPLATE_PATH=".github/release_templates/GLOBAL_template.md"
          
          # Sostituisce <TAG> con il valore inserito nel trigger
          sed "s/<TAG>/${{ github.event.inputs.tag_name }}/g" "$TEMPLATE_PATH" > final_body.md
          
          # Carica il contenuto in GITHUB_ENV gestendo correttamente i ritorni a capo
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          cat final_body.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download ALL artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: OpenFIRE-* # Exclude the internal WebApp publication artifact.
          path: ./release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: ${{ github.event.inputs.release_name }}
          body: ${{ env.RELEASE_BODY }} # <--- Usa il corpo generato dal template globale
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ github.event.inputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ALL assets to Release
        run: |
          find ./release_assets -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file"
            gh release upload ${{ github.event.inputs.tag_name }} "$file" --clobber --repo ${{ github.repository }}
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  



