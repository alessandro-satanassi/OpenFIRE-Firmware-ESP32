# ==========================================
  # 3. SYNC FIRMWARE TO WEB FLASHER REPOSITORY
  # ==========================================
  sync_web_firmware:
    #needs: [build_lightgun, build_dongle, build_pedal]
    needs: [version, package_lightgun, package_dongle, package_pedal]
    runs-on: ubuntu-latest

    concurrency:
      # All source branches update the same destination catalog.
      group: sync-openfire-webflasher-main
      cancel-in-progress: false

    if: ${{ github.event.inputs.update_webflasher == 'true' && github.event.inputs.release == 'yes' }}

    env:
      # Il tag e il flag di pre-release vengono dalla versione del firmware, non dalla
      # maschera: la cartella firmware/<tag>/ del Web Flasher non puo' piu' portare un
      # nome che il firmware dentro non riconosce.
      TAG_NAME: ${{ needs.version.outputs.tag }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      # URL FISSO DEL TUO SECONDO REPOSITORY
      TARGET_REPO: "alessandro-satanassi/OpenFIRE-ESP32-WebFlasher"
      
    steps:
      - name: Verify Execution Branch
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "ERRORE FATALE: Stai eseguendo la Action da un Tag Storico."
            exit 1
          fi

      # 1. SCARICA IL REPOSITORY WEB (Usando il Token Segreto)
      - name: Checkout Web Flasher Repository
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.WEBFLASHER_TOKEN }}
          ref: main
          path: web_repo # Salva il repo web in una cartella temporanea

      # 2. SCARICA I BINARI APPENA COMPILATI DAL REPO 1
      - name: Download ALL compiled binaries
        uses: actions/download-artifact@v8
        with:
          pattern: OpenFIRE-*
          path: ./all_binaries

      # Use the same source revision as the binaries, not the current main branch.
      # This is independent of the optional WebApp publication.
      - name: Checkout matching board illustrations
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: firmware_source
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install board image optimizer dependency
        run: python -m pip install Pillow

# 3. SOSTITUISCE SOLO LA VERSIONE SELEZIONATA E AGGIORNA IL CATALOGO
      - name: Replace version files and update local catalog
        run: |
          python3 - <<'PY'
          import json, os, re, shutil, sys, tempfile
          from pathlib import Path
          from xml.etree import ElementTree

          # Reuse the WebApp optimizer without changing its sources or caches.
          source_repo = Path('firmware_source').resolve()
          sys.path.insert(0, str(source_repo / 'lightgun/scripts'))
          import build_board_pics
          if not build_board_pics.load_pillow():
              raise RuntimeError('Pillow is required to optimize board illustrations')

          tag_name = os.environ['TAG_NAME']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', tag_name):
              raise RuntimeError('Invalid tag: expected one safe directory name')
          prerelease = os.environ['PRERELEASE']
          if prerelease not in ('true', 'false'):
              raise RuntimeError('Invalid prerelease flag')

          repo = Path('web_repo').resolve()
          firmware_dir = repo / 'firmware'
          target_dir = firmware_dir / tag_name
          index_path = firmware_dir / 'versions.json'
          # Never recursively replace a root, an external path or a symlink.
          if firmware_dir.is_symlink() or not firmware_dir.is_dir():
              raise RuntimeError('Missing or symlinked firmware directory')
          if target_dir.is_symlink() or target_dir.resolve().parent != firmware_dir.resolve():
              raise RuntimeError('Unsafe version directory')
          if target_dir.exists() and not target_dir.is_dir():
              raise RuntimeError('Version path is not a directory')
          if index_path.is_symlink() or not index_path.is_file():
              raise RuntimeError('Deploy firmware/versions.json before running this sync')

          # The index is authoritative: do not rediscover manually hidden versions.
          index = json.loads(index_path.read_text(encoding='utf-8-sig'))
          if not isinstance(index, dict) or not isinstance(index.get('versions'), list):
              raise RuntimeError('Invalid versions.json')
          entries = index['versions']
          tags = set()
          for entry in entries:
              if (not isinstance(entry, dict) or
                  not isinstance(entry.get('tag_name'), str) or
                  not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', entry['tag_name']) or
                  not isinstance(entry.get('prerelease'), bool) or entry['tag_name'] in tags):
                  raise RuntimeError('Invalid or duplicate versions.json entry')
              tags.add(entry['tag_name'])

          # Validate all downloaded binaries before touching the previous version.
          binaries = {}
          manifest = {
              'version': tag_name,
              'files': [],
              'supported_boards': {'LIGHTGUN': [], 'DONGLE': [], 'PEDAL': []}
          }
          for source in sorted(Path('all_binaries').rglob('*.bin')):
              match = re.fullmatch(r'OpenFIRE-(LIGHTGUN|DONGLE|PEDAL)-([A-Za-z0-9_]+)\.bin', source.name)
              if (not match or source.is_symlink() or not source.is_file() or
                  source.stat().st_size == 0 or source.name in binaries):
                  raise RuntimeError(f'Invalid, empty or duplicate binary: {source}')
              device, board = match.groups()
              binaries[source.name] = source
              manifest['supported_boards'][device].append(board)
          if not all(manifest['supported_boards'].values()):
              raise RuntimeError('Missing Lightgun, Dongle or Pedal binaries')
          manifest['files'] = sorted(binaries)

          # Only the previews used by the WebFlasher's board table (img fields).
          # These five shared files cover all Lightgun, Dongle and Pedal entries.
          pictures_dir = source_repo / 'docs/board_scheme'
          required_pictures = {
              'ESP32S3-Devkit-C.svg', 'esp32-s3-pico.svg', 'esp32-s3-zero.svg',
              'LILYGO-T-Dongle-S3-ESP32-S3.svg', 'esp32-s3-pocket-dongle-s3.svg'
          }
          pictures = [pictures_dir / name for name in sorted(required_pictures)]
          if (pictures_dir.is_symlink() or not pictures_dir.is_dir() or
              any(p.is_symlink() or not p.is_file() for p in pictures)):
              raise RuntimeError('Missing board illustrations for the WebFlasher')

          current = next((entry for entry in entries if entry['tag_name'] == tag_name), None)
          if current is None:
              entries.insert(0, {'tag_name': tag_name, 'prerelease': prerelease == 'true'})
          else:
              # Keep this version's position and all unrelated manual metadata.
              current['prerelease'] = prerelease == 'true'

          # Prepare everything first. A failure here leaves the old version intact.
          # The repository is published only by the following commit/push step.
          with tempfile.TemporaryDirectory(prefix='webflasher-', dir=repo.parent) as temporary:
              staged = Path(temporary) / 'version'
              staged.mkdir()
              for name, source in binaries.items():
                  shutil.copyfile(source, staged / name)
              staged_pictures = staged / 'board_pics'
              staged_pictures.mkdir()
              for source in pictures:
                  if source.is_symlink() or not source.is_file():
                      raise RuntimeError(f'Invalid board illustration: {source}')
                  svg, raster_done = build_board_pics.optimize_svg(source.read_bytes())
                  if not raster_done or ElementTree.fromstring(svg).tag != '{http://www.w3.org/2000/svg}svg':
                      raise RuntimeError(f'Invalid or unoptimized SVG: {source}')
                  (staged_pictures / source.name).write_text(svg, encoding='utf-8')
              (staged / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
              staged_index = Path(temporary) / 'versions.json'
              staged_index.write_text(json.dumps(index, indent=2) + '\n', encoding='utf-8')
              if target_dir.exists():
                  shutil.rmtree(target_dir)
              staged.rename(target_dir)
              staged_index.replace(index_path)
          print(f'Prepared {tag_name}: {len(binaries)} binaries, {len(pictures)} board illustrations; other versions preserved.')
          PY

      # 4. TRASFERIMENTO SUL SERVER (SISTEMA BLINDATO)
      - name: Commit and Push to Web Flasher Repo
        run: |
          # Entriamo fisicamente nella cartella del Repo 2
          cd web_repo
          
          export GIT_TERMINAL_PROMPT=0
          
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git config core.autocrlf false
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 20
          git config http.postBuffer 524288000
          
          # Include removed legacy files and the catalog in the same commit.
          git add -A -f -- "firmware/${TAG_NAME}" firmware/versions.json
          
          if ! git diff --staged --quiet; then
            echo "Modifiche rilevate nel Repo Web. Preparazione del commit..."
            
            printf "Auto-sync firmware binaries for Web Flasher (%s)\n" "$TAG_NAME" | git commit -F -
            
            echo "Avvio Sincronizzazione Cross-Repo (Sistema Anti-Glitch con Recovery)..."
            
            SYNC_SUCCESS="false"
            for i in 1 2 3; do
              echo "--- Tentativo $i di 3 ---"
              
              # Do not silently overwrite a concurrent manual catalog edit.
              if ! git pull origin main --rebase; then
                echo "Errore di rete o conflitto con modifiche concorrenti. Nessuna sovrascrittura forzata."
                git rebase --abort >/dev/null 2>&1 || true
                [ $i -lt 3 ] && sleep 5
                continue
              fi
              
              if git push origin main; then
                echo "Sincronizzazione completata! I file sono online su OpenFIRE-ESP32-WebFlasher."
                SYNC_SUCCESS="true"
                break
              fi
              
              echo "Rete instabile durante il push."
              [ $i -lt 3 ] && sleep 5
            done
            
            if [ "$SYNC_SUCCESS" = "false" ]; then
              echo "ERRORE FATALE: Impossibile trasferire i file nel Web Flasher dopo 3 tentativi."
              exit 1
            fi
            
          else
            echo "Nessuna modifica rilevata nei file binari. Push ignorato per mantenere pulita la history."
          fi
          
  # ==========================================
  # 4. SYNC WEBAPP TO GITHUB PAGES REPOSITORY
  # ==========================================
  sync_webapp:
    needs: [version, package_lightgun, package_dongle, package_pedal]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      # Every source branch writes the same destination branch and versions.json.
      group: sync-openfire-webapp-main
      cancel-in-progress: false
    if: ${{ github.event.inputs.update_webapp == 'true' && github.event.inputs.release == 'yes' && github.event.inputs.sistemi_operativi == 'yes' }}
    env:
      TAG_NAME: ${{ needs.version.outputs.tag }}
    steps:
      - name: Verify Execution Branch
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "ERRORE FATALE: Stai eseguendo la Action da un Tag Storico."
            exit 1
          fi

      - name: Checkout WebApp Repository
        uses: actions/checkout@v6
        with:
          repository: alessandro-satanassi/OpenFIRE-ESP32-WebApp
          ref: main
          token: ${{ secrets.WEBAPP_TOKEN }}
          path: webapp_repo

      - name: Download generated WebApp
        uses: actions/download-artifact@v8
        with:
          name: webapp-publication
          path: webapp_dist

      - name: Update versioned site, launcher and versions.json
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import shutil
          from pathlib import Path

          source = Path('webapp_dist')
          repo = Path('webapp_repo')
          version = json.loads((source / 'version.json').read_text(encoding='utf-8-sig'))
          if not isinstance(version, dict) or any(
              not isinstance(version.get(key), str) for key in ('id', 'label', 'type')
          ) or not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z][A-Za-z0-9]*)?', version['id']):
              raise RuntimeError('Invalid WebApp version metadata')

          # The folder ID is the complete version of the firmware - 7.0.0, or 7.0.0-beta1 -
          # which is exactly the string the lightgun sends when it docks. The release tag is
          # that same version with a "v" in front, and both come from OpenFIREversion.h: if
          # they disagree here, something rewrote one of them on the way.
          version_id = version['id']
          tag = os.environ['TAG_NAME']
          if tag != 'v' + version_id:
              raise RuntimeError('Release tag ' + tag + ' does not match the app version ' + version_id)
          required = ('site/index.html', 'site/style.css', 'site/app.js',
                      'launcher/index.html', 'launcher/launcher.js', 'launcher/.nojekyll')
          for name in required:
              path = source / name
              if not path.is_file() or (path.name != '.nojekyll' and path.stat().st_size == 0):
                  raise RuntimeError('Missing or empty WebApp file: ' + name)
          if not any((source / 'site/boards/pics').glob('*.js')):
              raise RuntimeError('WebApp board pictures are missing')

          index_path = repo / 'versions.json'
          index = json.loads(index_path.read_text(encoding='utf-8-sig')) if index_path.exists() else {'versions': []}
          if not isinstance(index, dict) or not isinstance(index.get('versions'), list):
              raise RuntimeError('Invalid versions.json: publication aborted')
          entries = index['versions']
          ids = set()
          for entry in entries:
              if not isinstance(entry, dict) or not isinstance(entry.get('id'), str) or not entry['id'] or entry['id'] in ids:
                  raise RuntimeError('Invalid or duplicate entry in versions.json')
              ids.add(entry['id'])

          # Keep all other versions and any extra metadata already in the index.
          current = next((entry for entry in entries if entry['id'] == version_id), {})
          current.update(version)
          index['versions'] = [current] + [entry for entry in entries if entry['id'] != version_id]
          index['latest'] = version_id

          target = repo / 'v' / version_id
          # Only replace this generated version, never the repository or all of v/.
          if (repo / 'v').is_symlink() or target.is_symlink():
              raise RuntimeError('Refusing to replace a symlinked version directory')
          if target.exists():
              shutil.rmtree(target)
          shutil.copytree(source / 'site', target)
          for name in ('index.html', 'launcher.js', '.nojekyll'):
              shutil.copyfile(source / 'launcher' / name, repo / name)
          index_path.write_text(json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('WEBAPP_VERSION=' + version_id + '\n')
          print('WebApp updated in v/' + version_id + '/; other versions preserved.')
          PY

      - name: Commit and Push to WebApp Repo
        working-directory: webapp_repo
        run: |
          export GIT_TERMINAL_PROMPT=0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.autocrlf false
          git config http.lowSpeedLimit 1000
          git config http.lowSpeedTime 20

          git add -f -- "v/${WEBAPP_VERSION}" index.html launcher.js .nojekyll versions.json
          if git diff --staged --quiet; then
            echo "WebApp gia' aggiornata: nessun commit necessario."
            exit 0
          fi
          printf 'Auto-sync WebApp %s (%s)\n' "$WEBAPP_VERSION" "$TAG_NAME" | git commit -F -

          # Retry transport errors, but never force or auto-resolve concurrent edits.
          # A conflicting remote update must fail the sync and block this release.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Repository WebApp sincronizzato; GitHub Pages pubblichera' il sito."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          echo "ERRORE FATALE: Sincronizzazione WebApp non riuscita. Release bloccata."
          exit 1

  # ==========================================
  # 5. CREAZIONE DELLA RELEASE GLOBALE (DOPO le sincronizzazioni richieste)
  # ==========================================
  create_global_release:
    # A disabled sync may be skipped; every requested sync must explicitly succeed.
    needs: [version, package_lightgun, package_dongle, package_pedal, sync_web_firmware, sync_webapp]
    runs-on: ubuntu-latest
    env:
      # Tag, titolo e flag di pre-release della versione compilata: vedi il job "version".
      TAG_NAME: ${{ needs.version.outputs.tag }}
    if: >-
      ${{ !failure() && !cancelled() &&
          github.event.inputs.release == 'yes' &&
          github.event.inputs.sistemi_operativi == 'yes' &&
          needs.version.result == 'success' &&
          needs.package_lightgun.result == 'success' &&
          needs.package_dongle.result == 'success' &&
          needs.package_pedal.result == 'success' &&
          (github.event.inputs.update_webflasher != 'true' || needs.sync_web_firmware.result == 'success') &&
          (github.event.inputs.update_webapp != 'true' || needs.sync_webapp.result == 'success') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 # Fondamentale per leggere GLOBAL_template.md

      - name: Prepare GLOBAL Release Body
        id: prepare_body
        run: |
          TEMPLATE_PATH=".github/release_templates/GLOBAL_template.md"

          # Sostituisce <TAG> con il tag ricavato dalla versione del firmware. Passa per
          # una variabile d'ambiente e per python invece che per sed, cosi' il valore non
          # finisce mai dentro il testo del comando.
          TAG_NAME="$TAG_NAME" python3 - "$TEMPLATE_PATH" > final_body.md <<'PY'
          import os, sys
          sys.stdout.write(open(sys.argv[1], encoding='utf-8').read().replace('<TAG>', os.environ['TAG_NAME']))
          PY

          # Carica il contenuto in GITHUB_ENV gestendo correttamente i ritorni a capo
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          cat final_body.md >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Download ALL artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: OpenFIRE-* # Exclude the internal WebApp publication artifact.
          path: ./release_assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }} # New tags must identify the commit actually built.
          name: ${{ needs.version.outputs.release_name }}
          body: ${{ env.RELEASE_BODY }} # <--- Usa il corpo generato dal template globale
          draft: ${{ github.event.inputs.draft }}
          prerelease: ${{ needs.version.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ALL assets to Release
        run: |
          find ./release_assets -type f -print0 | while IFS= read -r -d '' file; do
            echo "Uploading $file"
            gh release upload "$TAG_NAME" "$file" --clobber --repo "$GITHUB_REPOSITORY"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  
